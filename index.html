<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Revisit Retention CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&display=swap">
<style>
/* Layout: fixed left rail + scrolling workspace; the rail turns into a top scroller on narrow screens */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#EBEFEB; --ink:#14201B; --ink-2:#55625C; --ink-3:#85918B; --line:#DAE1DC;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#DAEFE7;
  --gold:#A5761A; --gold-soft:#F5E9CF;
  --s-new:#2F62D0; --s-active:#1C8A56; --s-due:#B07A06; --s-overdue:#CC5B16; --s-risk:#C0392D; --s-lost:#76817C;
  --cam:#0C1311; --cam-line:#22302B; --cam-body:#34443E; --cam-text:#E8F0EC;
  --wa-bg:#E8E1D5; --wa-in:#FFFFFF; --wa-out:#D5F4CB; --wa-head:#0B6B57; --wa-ink:#15201B;
  --shadow:0 1px 2px rgba(20,32,27,.05),0 10px 28px rgba(20,32,27,.07);
  --overlay:rgba(12,20,17,.45);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2521; --ink:#E6EEEA; --ink-2:#A0AFA8; --ink-3:#71807A; --line:#27332E;
  --accent:#3DC19F; --accent-ink:#04231B; --accent-soft:#12372E;
  --gold:#E0B25A; --gold-soft:#3A2F17;
  --s-new:#7EA2F2; --s-active:#4CC98B; --s-due:#E3B23C; --s-overdue:#F08A4B; --s-risk:#F06B5E; --s-lost:#95A19B;
  --wa-bg:#1A221F; --wa-in:#24302B; --wa-out:#1F4A3A; --wa-head:#12332A; --wa-ink:#E6EEEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2521; --ink:#E6EEEA; --ink-2:#A0AFA8; --ink-3:#71807A; --line:#27332E;
  --accent:#3DC19F; --accent-ink:#04231B; --accent-soft:#12372E;
  --gold:#E0B25A; --gold-soft:#3A2F17;
  --s-new:#7EA2F2; --s-active:#4CC98B; --s-due:#E3B23C; --s-overdue:#F08A4B; --s-risk:#F06B5E; --s-lost:#95A19B;
  --wa-bg:#1A221F; --wa-in:#24302B; --wa-out:#1F4A3A; --wa-head:#12332A; --wa-ink:#E6EEEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand-sub{font-size:11.5px;color:var(--ink-3);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-label{padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink)}
.nav a.on svg{color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--s-risk);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.nav .later{margin-left:auto;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.rail-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:22px}
.topbar .sub{font-size:12.5px;color:var(--ink-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.proto{font-size:11.5px;color:var(--ink-2);border:1px dashed var(--line);border-radius:99px;padding:3px 10px}
.me{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12.5px;border:1px solid var(--line)}
#view{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16.5px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid-2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--s-risk)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.big{padding:10px 16px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px 2px 8px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.plain::before{display:none}
.tier{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
.tier.vip{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--ink);background:color-mix(in srgb,var(--h) 22%,var(--surface))}
.avatar.lg{width:64px;height:64px;font-size:21px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who span{display:block;font-size:12.5px;color:var(--ink-3)}
.link{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
input.field,select.field,textarea.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px}
input.field:focus,select.field:focus,textarea.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:4px}
.switch{position:relative;width:38px;height:22px;flex:none;border-radius:99px;background:var(--line);border:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.divider{height:1px;background:var(--line);margin:4px 0}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.check-list{display:flex;flex-direction:column;gap:6px;font-size:13px}
.check-list div{display:flex;gap:8px;align-items:flex-start}
.ok{color:var(--s-active)} .warn{color:var(--s-due)} .bad{color:var(--s-risk)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .d{font-size:12px;color:var(--ink-3)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .l,.kpi.hero .d{color:var(--accent-ink);opacity:.85}

/* tables */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}

/* action items */
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .why{font-size:13px;color:var(--ink-2);margin-top:3px}
.act .todo{font-size:13px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
.act .todo svg{width:15px;height:15px;color:var(--accent)}
.act .val{text-align:right;min-width:0}
.act .val b{display:block;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.act .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.act.full{grid-template-columns:4px auto minmax(0,1fr) auto}

/* feed */
.feed{display:flex;flex-direction:column}
.feed-i{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.feed-i:last-child{border-bottom:0}
.feed-i time{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.feed-i.fresh{animation:fresh 1.4s ease-out}
@keyframes fresh{from{background:var(--accent-soft)}to{background:transparent}}
.src{font-size:12px;color:var(--ink-3)}

/* camera */
.cams{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.cam{background:var(--cam);border-radius:14px;overflow:hidden;position:relative}
.cam svg{display:block;width:100%;height:auto}
.cam-meta{position:absolute;left:12px;top:10px;font-size:11px;letter-spacing:.08em;color:var(--cam-text);opacity:.8;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.rec{width:7px;height:7px;border-radius:50%;background:#E5484D;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.cam-state{position:absolute;right:12px;top:8px;font-size:11px;color:var(--cam-text);background:rgba(255,255,255,.1);border-radius:99px;padding:2px 9px}
.cam-small .cam-meta{font-size:10px}

/* profile */
.profile{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.p-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.p-head h2{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:var(--surface);padding:12px}
.stats b{display:block;font-family:var(--f-display);font-size:16.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-3)}
.insight{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.insight .eyebrow{color:var(--accent);display:flex;align-items:center;gap:6px}
.insight p{margin:8px 0 0;line-height:1.6}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0}
.tl{position:relative;display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:13.5px;top:28px;bottom:0;width:1px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.tl-dot svg{width:14px;height:14px}
.tl-i b{font-weight:600}
.tl-i .when{font-size:12px;color:var(--ink-3)}
.tl-i .txt{font-size:13px;color:var(--ink-2)}

/* whatsapp phone */
.phone{width:100%;max-width:320px;margin:0 auto;border-radius:28px;border:8px solid var(--ink);overflow:hidden;background:var(--wa-bg);box-shadow:var(--shadow)}
.wa-head{background:var(--wa-head);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.wa-head .avatar{width:30px;height:30px;font-size:11px;background:rgba(255,255,255,.2);color:#fff}
.wa-head b{font-size:13.5px;display:block}
.wa-head span{font-size:11px;opacity:.8}
.wa-body{padding:14px 12px 18px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.bub{max-width:88%;background:var(--wa-in);color:var(--wa-ink);border-radius:10px;padding:8px 10px 6px;font-size:13px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08);align-self:flex-start;overflow-wrap:anywhere}
.bub.out{align-self:flex-end;background:var(--wa-out)}
.bub .t{display:block;text-align:right;font-size:10.5px;opacity:.55;margin-top:2px}
.bub .var{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 3px}
.bub .btnrow{display:block;border-top:1px solid color-mix(in srgb,var(--wa-ink) 12%,transparent);margin:8px -10px -6px;padding:7px;text-align:center;color:#128C7E;font-weight:600}
.bub.urdu{direction:rtl;text-align:right;font-family:var(--f-urdu);font-size:14px;line-height:2.2}
.wa-day{align-self:center;font-size:11px;background:var(--wa-in);color:var(--wa-ink);opacity:.8;border-radius:6px;padding:2px 8px}

/* bars */
.bars svg{width:100%;height:auto;display:block}
.health{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.health div{background:var(--c)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin-top:14px}
.legend div{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-2)}
.legend b{font-family:var(--f-display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter div{height:100%;background:var(--c,var(--accent));border-radius:99px}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.funnel div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.funnel b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.funnel span{font-size:11.5px;color:var(--ink-3)}

/* later */
.later-card{max-width:760px}
.later-card ul{margin:10px 0 0;padding-left:18px;line-height:1.8}

/* modal + toast */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--surface);border-radius:16px;width:100%;max-width:620px;max-height:calc(100% - 32px);overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.dialog.wide{max-width:820px}
.d-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 0}
.d-head h2{font-size:19px}
.d-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.d-foot{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.x{margin-left:auto;border:0;background:none;color:var(--ink-3);padding:4px}
.x svg{width:20px;height:20px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.consent{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.consent input{margin-top:3px;accent-color:var(--accent)}
.consent b{display:block}
.radio-card{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{accent-color:var(--accent)}
.radio-card .n{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
#toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100% - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(12px);opacity:0}}
.toast b{display:block;font-size:13.5px}

function barChart(data){
  const W = 560, Hh = 220, L = 44, R = 12, T = 16, B = 34, max = 100;
  const bw = (W - L - R) / data.length;
  const y = v => T + (Hh - T - B) * (1 - v / max);
  const ticks = [0,25,50,75,100];
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Revenue recovered per week, in thousands of rupees">
    ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${t}k</text>`).join('')}
    ${data.map(([l,v],i) => { const last = i === data.length-1; const x = L + i*bw + bw*.18, w = bw*.64;
      return `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="4" fill="${last?'var(--accent)':'color-mix(in srgb, var(--accent) 35%, var(--surface-2))'}"/>
      <text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" font-size="11" font-weight="${last?700:500}" fill="var(--ink-2)">${v.toFixed(v%1?1:0)}k</text>
      <text x="${x+w/2}" y="${Hh-12}" text-anchor="middle" font-size="11" fill="${last?'var(--ink)':'var(--ink-3)'}" font-weight="${last?600:400}">${l}</text>`; }).join('')}
  </svg>`;
}

function camSvg(cam, main){
  const w = 400, h = 240;
  const person = cam.mode !== 'idle';
  const col = cam.mode === 'match' ? '#3DC19F' : cam.mode === 'confirm' ? '#E3B23C' : '#A0AFA8';
  const c = cam.cid ? byId(cam.cid) : null;
  const label = cam.mode === 'match' ? `${c.name} · ${cam.conf}%` : cam.mode === 'confirm' ? `Possible: ${first(c)} · ${cam.conf}%` : 'Unknown · not stored';
  const lw = label.length * 6.4 + 16;
  const br = (x,y,dx,dy) => `<path d="M${x} ${y+dy*14}V${y}H${x+dx*14}" fill="none" stroke="${col}" stroke-width="3"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${main?'Entrance camera':'Reception camera'}">
    <rect width="${w}" height="${h}" fill="var(--cam)"/>
    <path d="M0 190 L400 175" stroke="var(--cam-line)" stroke-width="2"/>
    <rect x="${main?110:250}" y="30" width="${main?180:110}" height="${main?160:150}" fill="none" stroke="var(--cam-line)" stroke-width="6"/>
    ${main?'':'<rect x="30" y="120" width="170" height="44" rx="4" fill="var(--cam-line)"/><rect x="60" y="95" width="40" height="28" rx="3" fill="var(--cam-line)"/>'}
    ${person?`<g><circle cx="200" cy="100" r="30" fill="var(--cam-body)"/><path d="M128 240 C130 168 270 168 272 240 Z" fill="var(--cam-body)"/>
      ${br(162,58,1,1)}${br(238,58,-1,1)}${br(162,146,1,-1)}${br(238,146,-1,-1)}
      <rect x="${200-lw/2}" y="30" width="${lw}" height="20" rx="4" fill="${col}"/><text x="200" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C1311" font-family="Onest, sans-serif">${esc(label)}</text></g>`:''}
  </svg>`;
}

function timeline(c){
  const t = [];
  const base = c.prevLast !== undefined ? c.prevLast : c.last;
  const hist = c.prevLast !== undefined ? c.visits - 1 : c.visits;
  const n = Math.min(hist, 6);
  for (let i = 0; i < n; i++){
    const d = i === 0 ? base : base + i*c.interval + ((i*7 + c.id*3) % 5) - 2;
    const amt = avg(c) * (1 + ((i*13 + c.id) % 7 - 3) / 40);
    t.push({d, type:'visit', title: d === 0 ? 'Checked in today' : 'Visit', text:`${(i % 3 === 2 && c.alt) ? c.alt : c.service} with ${c.staff} · ${fmt(amt)}`, meta: c.face ? `Face ID · ${95 + (i+c.id)%4}% match` : 'Phone check-in'});
  }
  if (c.fb && base > 0) t.push({d:base, type:'feedback', title:`Rated the visit ${c.fb}/5`, text: c.fbNote ? `“${c.fbNote}”` : 'No comment', ord:1});
  if (base > c.interval && base <= 180) t.push({d:base - c.interval, type:'message', title:'Rebooking reminder sent', text:'WhatsApp template · Delivered · Read · No reply'});
  if (base > 180) t.push({d:base - c.interval*2, type:'message', title:'Rebooking reminder sent', text:'WhatsApp template · Delivered · Not read'});
  const firstD = base + (hist-1)*c.interval;
  if (c.refBy) t.push({d:firstD, type:'referral', title:`Referred by ${byId(c.refBy).name}`, text:'Referral code AYESHA-24 used at registration', ord:2});
  t.push({d:firstD, type:'consent', title: c.face ? 'Consented to Face ID and WhatsApp messages' : 'Consented to WhatsApp messages (declined Face ID)', text:'Recorded by Rida Aslam at the front desk · policy v1.2', ord:3});
  (S.events[c.id] || []).forEach(e => t.push({...e, ord:-1}));
  t.sort((a,b) => a.d - b.d || (a.ord||0) - (b.ord||0));
  const col = {visit:'var(--accent)', feedback:'var(--s-due)', message:'var(--s-new)', consent:'var(--s-lost)', referral:'var(--gold)', call:'var(--s-overdue)'};
  const icn = {visit:'check', feedback:'star', message:'msg', consent:'lock', referral:'gift', call:'phone'};
  return `<div class="tl">${t.map(e => `<div class="tl-i"><div class="tl-dot" style="--c:${col[e.type]}">${ic(icn[e.type],14)}</div><div><div class="row" style="gap:8px"><b>${esc(e.title)}</b><span class="when">${e.d===0?(e.time?'Today '+e.time:'Today'):dateAgo(e.d)}</span></div><div class="txt">${esc(e.text)}${e.meta?` · <span class="faint">${esc(e.meta)}</span>`:''}</div></div></div>`).join('')}${hist > 6 ? `<div class="faint small" style="padding-left:40px">+ ${hist-6} earlier visits</div>`:''}</div>`;
}

function toast({title, body='', tone='var(--accent)', cta=null, ms=6000}){
  const el = document.createElement('div');
  el.className = 'toast'; el.style.setProperty('--c', tone);
  el.innerHTML = `<div style="min-width:0;flex:1"><b>${title}</b>${body?`<p>${body}</p>`:''}${cta?`<a class="btn sm" href="${cta.href}">${cta.label}</a>`:''}</div><button class="x" aria-label="Dismiss">${ic('x',16)}</button>`;
  el.querySelector('.x').onclick = () => el.remove();
  el.querySelectorAll('a').forEach(a => a.addEventListener('click', () => el.remove()));
  $('#toasts').prepend(el);
  [...$('#toasts').children].slice(2).forEach(x => x.remove());
  setTimeout(() => el.remove(), ms);
}

function estimate(){
  const box = $('#k-est'); if (!box) return;
  const seg = SEGS.find(s => s.id === (document.querySelector('input[name=seg]:checked')||{}).value) || SEGS[0];
  const off = $('#k-offer').value;

/* ---------- check-in simulation ---------- */
const SCRIPT = [
  {type:'match', cid:1, conf:97}, {type:'confirm', cid:3, conf:83}, {type:'unknown'},
  {type:'match', cid:4, conf:95}, {type:'match', cid:9, conf:94}, {type:'match', cid:13, conf:91}, {type:'match', cid:7, conf:96}
];
function checkIn(c, source, conf, time){
  const prev = status(c);
  const avgT = avg(c);
  const wasOverdueGap = c.last;
  if (c.prevLast === undefined && c.last > 0) c.prevLast = c.last;
  c.last = 0; c.visits++; c.spend += Math.round(avgT);
  S.visitsToday++;
  S.arrivals.forEach(a => a.fresh = false);
  S.arrivals.unshift({time, cid:c.id, source, conf, prev, fresh:true});
  addEvent(c.id, {type:'visit', title:'Checked in today', text:`${source}${conf?` · ${conf}% match`:''}`, time});
  if (['Due','Overdue','At Risk','Lost'].includes(prev)) S.recoveredSession += Math.round(avgT);
  if (S.done[c.id] === undefined && !action(c)) {}
  const alertNeeded = c.tier === 'VIP' || prev === 'At Risk' || prev === 'Overdue';
  if (alertNeeded) {
    let body = '';
    if (c.fb <= 2) body = `Rated last visit ${c.fb}/5 (“${esc(c.fbNote)}”). Manager notified. Greet her personally.`;
    else if (prev === 'Overdue' || prev === 'At Risk') body = `Back after ${wasOverdueGap} days (usual ${c.interval}). ${c.prefs ? esc(c.prefs.split(' · ')[0]) + '. ' : ''}Book her next ${esc(c.service.toLowerCase())} before she leaves.`;
    else body = `${esc(c.prefs.split(' · ')[0] || 'Usual: '+c.service)}.`;
    toast({title:`${c.tier==='VIP'?'★ VIP arrived':'Returning customer'}: ${esc(c.name)}`, body: (prev!=='Active'?`<b>Was ${prev}.</b> `:'') + body, tone: c.fb<=2 ? 'var(--s-risk)' : 'var(--gold)', cta:{label:'Open profile', href:`#customer-${c.id}`}, ms:9000});
  } else {
    toast({title:`${esc(c.name)} checked in`, body:`${source}${conf?` · ${conf}% match`:''}`, cta:{label:'Open profile', href:`#customer-${c.id}`}});
  }
}
function simulate(){
  const sc = SCRIPT[S.simI % SCRIPT.length]; S.simI++;
  const time = clock();
  $('#sim-btn').classList.remove('pulse');
  if (sc.type === 'match'){
    const c = byId(sc.cid);
    if (!c) { simulate(); return; }
    S.cam = {mode:'match', cid:c.id, conf:sc.conf, time, prev:status(c)};
    checkIn(c, 'Face ID', sc.conf, time);
  } else if (sc.type === 'confirm'){
    const c = byId(sc.cid);
    S.cam = {mode:'confirm', cid:c.id, conf:sc.conf, time};
    S.pending.push({type:'confirm', cid:c.id, conf:sc.conf, time});
    toast({title:'Please confirm a possible match', body:`Looks like ${esc(c.name)} (${sc.conf}%). Confirm at the front desk.`, tone:'var(--s-due)', cta:{label:'Review', href:'#checkin'}, ms:8000});
  } else {
    S.cam = {mode:'unknown', time};
    S.pending.push({type:'unknown', time});
    toast({title:'Unrecognised visitor at the entrance', body:'No face data stored. Offer registration or look up by phone.', tone:'var(--s-lost)', cta:{label:'Review', href:'#checkin'}, ms:8000});
  }
  render();
}
function resolvePending(pred){ S.pending = S.pending.filter(p => !pred(p)); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, c = id ? byId(id) : null;
  if (act === 'close-bg') { if (e.target === el) closeModal(); return; }
  switch (act) {
    case 'simulate': simulate(); break;
    case 'close': closeModal(); break;
    case 'noop': break;
    case 'open-customer': location.hash = 'customer-' + id; break;
    case 'statusF': S.statusF = el.dataset.s; render(); break;
    case 'actF': S.actF = el.dataset.s; render(); break;
    case 'msg': msgModal(c, el.dataset.tpl); break;
    case 'call': callModal(c); break;
    case 'send': {
      const tpl = el.dataset.tpl;
      const names = {rebook:'Rebooking reminder', followup:'Personal follow-up', offer:'Comeback offer', feedback:'Feedback request', winback:'Win-back offer', noshow:'No-show follow-up'};
      addEvent(c.id, {type:'message', title:`${names[tpl]} sent`, text:'WhatsApp template · Delivered', time:clockNow()});
      markDone(c, `${names[tpl]} sent on WhatsApp`);
      closeModal(); render();
      toast({title:`${names[tpl]} sent to ${esc(first(c))}`, body:'Delivered on WhatsApp. Replies appear in her timeline.'});

      if (out === 'Booked an appointment') { c.fbResolved = true; S.appts.push({time:'Sat 11:00', cid:c.id, svc:c.service, staff:c.staff, st:'Booked'}); }
      markDone(c, `Called: ${out.toLowerCase()}`);
      closeModal(); render();
      toast({title:'Call outcome saved', body: out === 'Booked an appointment' ? `${esc(first(c))} is booked for Saturday 11:00 with ${esc(c.staff)}.` : esc(out)});

      modal(`${dHead(`Skip ${esc(first(c))} for today?`, 'The reason helps tune future recommendations')}<div class="d-body"><select id="skipr" class="field"><option>Already in touch with the customer</option><option>Customer is travelling</option><option>Not the right time</option><option>Recommendation is wrong</option></select></div><div class="d-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="skip-ok" data-id="${c.id}">Skip</button></div>`);
      break;
    case 'skip-ok': markDone(c, `Skipped: ${$('#skipr').value.toLowerCase()}`); closeModal(); render(); break;
    case 'undo': delete S.done[c.id]; render(); break;
    case 'confirm-yes': case 'confirm-no': {

      const cc = byId(S.cam.cid);

      else { S.cam = {mode:'unknown', time:S.cam.time}; S.pending.push({type:'unknown', time:S.cam.time}); S.audit.unshift({t:'Today '+S.cam.time, who:'Rida Aslam', what:'Rejected face match', target:`${cc.name} (${S.cam.conf}%)`}); }
      render(); break; }

      const p = S.pending[+el.dataset.i];

    case 'lookup':
      modal(`${dHead('Find customer by phone')}<div class="d-body"><input id="lk" class="field" value="+92 300 118 5572" aria-label="Phone number"><div class="note">Match found: <b>Hamza Ali</b> · Overdue · not opted in to Face ID</div></div><div class="d-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="lookup-ok">Check in Hamza</button></div>`);

    case 'lookup-ok': {

      resolvePending(p => p.type === 'unknown' && p.time === S.cam.time);
      if (h) { S.cam = {mode:'match', cid:16, conf:null, time:S.cam.time, prev:status(h)}; checkIn(h, 'Phone lookup', null, S.cam.time); }

      nc.visits = 1; nc.spend = est; S.visitsToday++; S.newToday++;
      S.arrivals.forEach(a => a.fresh = false);

      if (nc.refBy) { const r = byId(nc.refBy); r.refs++; r.refRev = (r.refRev||0) + est; }

      addEvent(c.id, {type:'consent', title: c.face ? 'Opted in to Face ID' : 'Withdrew Face ID consent', text: c.face ? 'Face template will be captured at next visit' : 'Face template deleted. Profile and history kept.', time:clockNow()});
      render(); toast({title: c.face ? 'Face ID turned on' : 'Face template deleted', body: c.face ? 'Recorded in the audit log.' : 'The profile and visit history are kept.'}); break; }
    case 'toggle-mkt': c.mkt = !c.mkt; addEvent(c.id, {type:'consent', title: c.mkt?'Opted in to WhatsApp offers':'Opted out of WhatsApp offers', text:'Changed by staff at customer request', time:clockNow()}); render(); break;
    case 'export': S.audit.unshift({t:'Today '+clockNow(), who:'Rida Aslam', what:'Exported customer data on request', target:c.name}); toast({title:'Export prepared', body:`${esc(first(c))}’s profile, visits, messages and consent history are ready to send to her. Logged in the audit log.`}); break;
    case 'delete':
      modal(`${dHead(`Delete ${esc(c.name)}?`)}<div class="d-body"><p style="margin:0">This permanently deletes the profile, face template, visit history, messages and feedback. Billing totals are kept without her name for accounting.</p></div><div class="d-foot"><button class="btn" data-act="close">Keep customer</button><button class="btn primary" style="background:var(--s-risk);border-color:var(--s-risk)" data-act="delete-ok" data-id="${c.id}">${ic('trash')}Delete permanently</button></div>`);
      break;
    case 'delete-ok': { const idx = C.indexOf(c); C.splice(idx,1); S.audit.unshift({t:'Today '+clockNow(), who:'Rida Aslam', what:'Deleted customer and all personal data', target:`Customer #${String(c.id).padStart(4,'0')}`}); closeModal(); location.hash = 'customers'; toast({title:'Customer deleted', body:'Recorded in the audit log without personal details.'}); break; }
    case 'book': toast({title:'Booking calendar', body:'In the full product this opens the booking calendar with the customer’s usual service and staff pre-selected.', tone:'var(--s-new)'}); break;
    case 'appt-in': { const a = S.appts[+el.dataset.i]; const cc = byId(a.cid); a.st = 'Checked in'; if (cc) checkIn(cc, 'Booked appointment', null, clockNow()); render(); break; }
    case 'appt-noshow': { const a = S.appts[+el.dataset.i]; const cc = byId(a.cid); a.st = 'No-show'; if (cc) addEvent(cc.id, {type:'message', title:'No-show follow-up sent', text:'WhatsApp template · Delivered', time:clockNow()}); render(); toast({title:`Marked ${esc(cc?first(cc):'customer')} as a no-show`, body:'A follow-up with a rebooking link was sent on WhatsApp.', tone:'var(--s-risk)'}); break; }
    case 'new-campaign': campaignModal(); break;
    case 'launch': {
      const seg = SEGS.find(s => s.id === document.querySelector('input[name=seg]:checked').value);
      const offT = $('#k-offer').selectedOptions[0].text;
      S.campaigns.unshift({name:$('#k-name').value || 'Untitled campaign', seg:seg.name, offer:offT, st:'Scheduled', when:$('#k-when').value, sent:0, read:0, replied:0, booked:0, rev:0, reach:+$('#k-est').dataset.reach});
      closeModal(); render(); toast({title:'Campaign scheduled', body:`${esc(seg.name)} · ${esc(offT)}`}); break; }
    case 'tpl': if (e.target.closest('.switch')) break; S.tplSel = id; render(); break;
    case 'tpl-toggle': { const t = S.templates.find(x => x.id === id); t.on = !t.on; render(); toast({title:`${t.name} ${t.on?'turned on':'paused'}`}); break; }
    case 'lang': S.tplLang = el.dataset.l; render(); break;
    case 'footage': S.settings.footage = !S.settings.footage; S.audit.unshift({t:'Today '+clockNow(), who:'Rida Aslam', what:`Camera footage storage turned ${S.settings.footage?'on (7 days)':'off'}`, target:'—'}); render(); break;
  }
});
function clockNow(){ return S.clock.map(n => String(n).padStart(2,'0')).join(':'); }

document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#ctable').innerHTML = custRows(); }
  if (e.target.dataset.set === 'high' || e.target.dataset.set === 'low') {
    const k = e.target.dataset.set; S.settings[k] = +e.target.value;
    if (S.settings.low >= S.settings.high) { S.settings.low = S.settings.high - 1; $('#low').value = S.settings.low; $('#low-v').textContent = S.settings.low + '%'; }
    $('#'+k+'-v').textContent = S.settings[k] + '%';
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'tierF') { S.tierF = e.target.value; $('#ctable').innerHTML = custRows(); }
  if (e.target.dataset.set === 'cap' || e.target.dataset.set === 'retention') { S.settings[e.target.dataset.set] = e.target.value; toast({title:'Setting saved'}); }
  if (e.target.id === 'tplsel') msgModal(byId(e.target.dataset.id), e.target.value);
  if (e.target.name === 'seg' || e.target.id === 'k-offer') estimate();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.click')) { e.preventDefault(); e.target.click(); }
});

go();
setTimeout(() => toast({title:'Welcome to the Revisit prototype', body:'All names and figures are sample data. Press <b>Simulate arrival</b> to watch a customer walk in, then explore the other pages.', ms:9000}), 600);
</script>

</body></html>
